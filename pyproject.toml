[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tennisage"
version = "0.1.0"
description = "Get tennis career data from tennisabstract.com and plot age gaps"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pandas", "requests", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
